site_name: beardnetworks Docs
repo_url: https://github.com/beardcodes/beardnetworks-docs
repo_name: beardcodes/beardnetworks-docs

theme:
  name: material
  icon:
    logo: material/nas
    admonition:
      bug: fontawesome/solid/robot

  # Mirrors zensical.org: system -> light -> dark, indigo primary,
  # orange accent on the dark scheme only.
  palette:
    - media: "(prefers-color-scheme)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: lucide/sun-moon
        name: Switch to light mode

    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: lucide/sun
        name: Switch to dark mode

    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: orange
      toggle:
        icon: lucide/moon-star
        name: Switch to system preference

  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.instant.preview
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - toc.follow
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - navigation.footer
    - navigation.indexes
    - content.tabs.link
    - search.share

plugins:
  - search

markdown_extensions:

  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.keys
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.details


